<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back · The Ultra of Us</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e94919'/%3E%3Cpath d='M5 23 13 8l5 10 3-5 6 10' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"></head><body class="login-page"><main class="login-card"><span class="brandmark">∧</span><p class="eyebrow">THE ULTRA OF US · CHRISTOPH &amp; ARI</p><h1>Your adventure.<br>Always together<span>.</span></h1><p>Log in to your shared collection of adventures, memories and badges.</p><form id="login-form"><label for="password">Your password</label><input id="password" type="password" autocomplete="current-password" required autofocus><p id="login-error" role="alert" hidden></p><button class="primary" type="submit">Let’s go</button></form><small>Same team. Same progress. Wherever you log in.</small></main><script>document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),error=document.getElementById('login-error');b.disabled=true;error.hidden=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Ultra-Request':'1'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Please try again.');location.replace('/')}catch(e){error.textContent=e.message||'Unable to connect. Please try again.';error.hidden=false;b.disabled=false}};</script></body></html>
